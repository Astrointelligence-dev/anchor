name: Sync Docs to astro-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check DOCS_SYNC_TOKEN
        id: token
        env:
          TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          echo "DOCS_SYNC_TOKEN length: ${#TOKEN}"
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCS_SYNC_TOKEN is missing or empty; astro-docs was not notified (see 02-repos/repo-astro-docs)"
          fi

      - name: Dispatch to astro-docs
        if: steps.token.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          repository: Astrointelligence-dev/astro-docs
          event-type: sync-anchor-docs
          client-payload: '{"ref": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'
